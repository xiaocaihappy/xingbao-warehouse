name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.1.9)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Create placeholder token.txt (extraResources needs it)
        shell: pwsh
        run: |
          "# placeholder" | Out-File -FilePath token.txt -Encoding utf8

      - name: Write .env from secrets
        working-directory: app
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            Write-Error "Secret VITE_SUPABASE_URL 未配置。请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 添加 VITE_SUPABASE_URL 和 VITE_SUPABASE_ANON_KEY。"
            exit 1
          }
          "VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL" | Out-File -FilePath .env -Encoding utf8
          "VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY" | Out-File -FilePath .env -Encoding utf8 -Append
          Write-Host ".env 已生成（值已隐藏）"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npx vite build

      - name: Publish to GitHub Releases
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npx electron-builder --win --publish always